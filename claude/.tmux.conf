# Box-only: re-apply the touch-friendly UI (mouse on, tap-to-toggle status line, one-line
# touch scrolling) to the kira box's DEFAULT tmux server every time it starts. That server
# hosts Ed's `claude` session for the Kira Studio app's Terminal tab and La Terminal, and
# claude-tmux-ui's settings live only in the running server: 10-04 the server restarted,
# nobody re-ran the script, and the app could no longer scroll.
# The guard keeps every other server untouched (her studio on -L kira, -L fnq, -L kira-dev,
# -L kira-bg, and the Mac, whose socket lives under its own uid).
%if "#{==:#{socket_path},/tmp/tmux-1000/default}"
run-shell -b "$HOME/.dotfiles/bin/claude-tmux-ui"
%endif
